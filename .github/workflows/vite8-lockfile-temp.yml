name: Temporary Vite 8 lockfile regeneration
on:
  push:
    branches: [chore/vite8-compatible-migration]
    paths:
      - package.json
      - .github/workflows/vite8-lockfile-temp.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit only refreshed lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "构建：更新 Vite 8 兼容依赖锁文件"
            git push origin HEAD:chore/vite8-compatible-migration
          fi
