name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Classify change risk
        id: classify
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-scope.mjs

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Report initial transfer size
        run: node scripts/performance-report.mjs

  browser-smoke:
    needs: scope
    if: needs.scope.outputs.scope != 'docs'
    # Playwright 1.56.1 尚不支持 ubuntu-latest 当前使用的 26.04。
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Verify locked Playwright version
        run: npm ls @playwright/test playwright playwright-core

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production app
        run: npm run build

      - name: Visual regression (CSS-only pull request)
        if: needs.scope.outputs.scope == 'visual'
        run: npx playwright test e2e/smoke.spec.js --grep '320|375|深色|暗色|减少动态|玻璃|滑块|页签|弹窗|二维码|对齐|分享结果|快捷启动|操作入口'

      - name: Browser regression
        if: needs.scope.outputs.scope == 'full'
        run: npx playwright test e2e/smoke.spec.js e2e/redirect.spec.js

      - name: Build app with /s2u/ public base
        if: needs.scope.outputs.scope == 'full'
        run: npm run build
        env:
          VITE_PUBLIC_BASE_URL: http://127.0.0.1:4173/s2u/

      - name: Browser regression for /s2u/ deployment
        if: needs.scope.outputs.scope == 'full'
        run: npx playwright test e2e/subpath.spec.js e2e/redirect.spec.js
        env:
          S2U_SUBPATH_TEST: '1'

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 3
