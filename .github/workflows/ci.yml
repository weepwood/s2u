name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # 临时生成日志：得到 npm 自己重新解析的锁文件后，将删除本诊断步骤。
      - name: Regenerate lockfile for migration
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo '__S2U_LOCK_BEGIN__'
          base64 -w 0 package-lock.json
          echo
          echo '__S2U_LOCK_END__'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Verify locked Playwright version
        run: npm ls @playwright/test playwright playwright-core

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production app
        run: npm run build

      - name: Browser regression
        run: npx playwright test e2e/smoke.spec.js

      - name: Build app with /s2u/ public base
        run: npm run build
        env:
          VITE_PUBLIC_BASE_URL: http://127.0.0.1:4173/s2u/

      - name: Browser regression for /s2u/ deployment
        run: npx playwright test e2e/subpath.spec.js
        env:
          S2U_SUBPATH_TEST: '1'

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 3
