name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Apply requested narrative removal
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/persistent-shortcuts-remove-title' && github.actor != 'github-actions[bot]'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          change = Path('src/components/Change.vue')
          text = change.read_text(encoding='utf-8')
          text, count = re.subn(
              r'\n        <div class="eyebrow">.*?\n        </p>\n',
              '\n',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Change.vue narrative block not found')
          change.write_text(text, encoding='utf-8')

          def remove_blocks(path, selectors):
              css_path = Path(path)
              css = css_path.read_text(encoding='utf-8')
              for selector in selectors:
                  pattern = re.compile(r'(?m)^\s*' + re.escape(selector) + r'\s*\{[^{}]*\}\n?')
                  css = pattern.sub('', css)
              css_path.write_text(css, encoding='utf-8')

          remove_blocks('src/styles/change.css', [
              '.eyebrow', '.status-dot', 'h1', 'h1 span',
              '.hero-description', '.hero-description code',
          ])
          remove_blocks('src/styles/interface-refresh.css', [
              '.app-shell .eyebrow', '.app-shell .status-dot',
              '.app-shell .workspace-head h1', '.app-shell .hero-description',
          ])

          motion = Path('src/utils/interfaceMotion.js')
          motion_text = motion.read_text(encoding='utf-8')
          motion_text = motion_text.replace("const NARRATIVE_SELECTOR = '.hero-description'\n", '')
          motion_text, count = re.subn(
              r'\n  const animateNarrative = \(\) => \{.*?\n  \}\n\n  const handleTabClick',
              '\n  const handleTabClick',
              motion_text,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('animateNarrative block not found')
          motion_text = motion_text.replace('    animateNarrative()\n', '')
          motion.write_text(motion_text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Change.vue src/styles/change.css src/styles/interface-refresh.css src/utils/interfaceMotion.js
          git diff --cached --quiet || git commit -m "删除页面说明与状态文案"
          git push origin HEAD:"$HEAD_REF"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
