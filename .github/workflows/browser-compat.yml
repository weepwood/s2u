name: Weekly browser compatibility

on:
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install browser runtimes
        run: npx playwright install --with-deps firefox webkit
      - name: Build production app
        run: npm run build
      - name: Run Firefox and WebKit smoke
        run: npx playwright test e2e/compat.spec.js --config playwright.compat.config.js
