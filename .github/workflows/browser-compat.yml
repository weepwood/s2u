name: Weekly browser compatibility

on:
  push:
    branches: [master]
    paths: ['package.json']
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/browser-compat.yml'
      - 'playwright.compat.config.js'
      - 'e2e/compat.spec.js'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  cross-browser-smoke:
    # 与锁定的 Playwright 1.56.1 保持系统兼容。
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install browser runtimes
        run: npx playwright install --with-deps firefox webkit
      - name: Build production app
        run: npm run build
      - name: Run Firefox and WebKit smoke
        run: npx playwright test e2e/compat.spec.js --config playwright.compat.config.js
