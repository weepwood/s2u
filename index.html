<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f5f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d111a" media="(prefers-color-scheme: dark)" />
    <title>Scheme to URL — 将链接或 URL Scheme 转换为跳转链接</title>
    <meta
      name="description"
      content="将 URL Scheme（如 weixin://）或任意网址转换为 HTTP 跳转链接。支持历史记录、深色模式、GitHub Gist 同步。"
    />

    <meta property="og:title" content="Scheme to URL" />
    <meta property="og:description" content="将 URL Scheme 或网址转换为可分享的 HTTP 跳转链接" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%BASE_URL%favicon.svg" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Scheme to URL" />
    <meta name="twitter:description" content="将 URL Scheme 或网址转换为可分享的 HTTP 跳转链接" />

  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
  <style>
    :root {
      color-scheme: light dark;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      /* 字体：系统字体栈，零外部字体请求，不阻塞首屏渲染 */
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
      --font-mono: ui-monospace, Menlo, Consolas, 'Liberation Mono', 'JetBrains Mono', monospace;
      --text-xs: 11px;
      --text-sm: 12px;
      --text-base: 14px;
      --text-lg: 15px;
      --text-xl: 17px;
      --text-2xl: 21px;
      --leading-none: 1.25;
      --leading-tight: 1.4;
      --leading-normal: 1.6;
      --leading-relaxed: 1.75;
      --tracking-tight: -0.02em;
      --tracking-normal: 0;
      --tracking-wide: 0.14em;
      --font-medium: 500;
      --font-semibold: 600;
      --font-bold: 700;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      min-height: 100%;
      overflow-y: auto;
      scrollbar-gutter: stable;
      background: #f3f5f9;
      font-size: var(--text-base);
      font-family: var(--font-sans);
      line-height: var(--leading-normal);
      color: #172033;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: #f3f5f9;
      color: inherit;
      font-family: inherit;
      font-size: inherit;
      line-height: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    button,
    input {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible,
    a:focus-visible,
    input:focus-visible {
      outline: 2px solid #4f6ef7;
      outline-offset: 3px;
    }

    @supports not (scrollbar-gutter: stable) {
      html {
        overflow-y: scroll;
      }
    }

    @media (prefers-color-scheme: dark) {
      html,
      body {
        background: #0d111a;
        color: #f2f5fb;
      }
    }
  </style>
</html>
